[editor]
theme = "catppuccin_latte"
mouse = true
cursorline = false
cursorlineopt = "number"  # highlight both number and

[editor.whitespace]
render = "none"

[editor.cursor-shape]
normal = "block"
insert = "block"
select = "block"

# mini.files (Miller columns): Space o / Space O — see autoconf defaults.
# [editor.mini-files.windows]
# preview = true
# [editor.mini-files.options]
# use_as_default_explorer = true
# permanent_delete = false

[keys.normal.space]
t = "open_theme_picker"
W = "workbench_files"       # Workbench Files, after explicit :Workbench enable.
"/" = "workbench_search"    # Replaces the default Space / global search; Space f remains the quick picker.
